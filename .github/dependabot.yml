version: 2
updates:
  # Cargo dependencies (direct + indirect)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    groups:
      # Combine all patch bumps into a single PR per check.
      # Minor and major bumps don't match (they fall through to individual PRs).
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

  # GitHub Actions used in CI workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Combine all patch bumps into a single PR per check.
      # Minor and major bumps don't match (they fall through to individual PRs).
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
