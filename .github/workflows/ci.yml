name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # Faster from-scratch builds in CI

permissions:
  contents: read


jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: cargo fmt --all -- --check

  test:
    name: test
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: |
            cargo build --locked
            cargo test --locked

  clippy:
    name: clippy
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: cargo clippy --all-targets --locked -- -D warnings

  # release-build:
  #   name: release build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
  #       with:
  #         runCmd: cargo build --release --locked

  docker-build:
    name: Build application with docker
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: Verify distroless base image
        run: |
          cosign verify gcr.io/distroless/static-debian13:nonroot \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com
      - name: Build application image
        run: docker build -t blog --target runtime -f .devcontainer/Dockerfile .

  deploy:
    name: Push runtime image to ghcr
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read   # checkout
      packages: write  # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Lowercase owner name
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: runtime
          push: true
          # :latest advances on each tag release; :<tag> is the versioned pin.
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/web:latest
            ghcr.io/${{ env.OWNER_LC }}/web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: Sign image (key-based)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Three orthogonal flags make cosign v3 emit what containers/image
          # (podman) can verify via use-sigstore-attachments:
          #  --new-bundle-format=false      legacy signature CONTENT (not protobuf)
          #  --registry-referrers-mode=legacy  tag-based .sig STORAGE (not OCI referrers)
          #  --use-signing-config=false     required for offline key-based signing in v3
          cosign sign --yes --recursive \
            --new-bundle-format=false --use-signing-config=false \
            --registry-referrers-mode=legacy \
            --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ env.OWNER_LC }}/web@${{ steps.build.outputs.digest }}
      - name: Attest SLSA provenance (key-based)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > provenance.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://github.com/actions/runner/github-hosted",
              "externalParameters": {
                "repository": "${{ github.repository }}",
                "ref": "${{ github.ref }}",
                "tag": "${{ github.ref_name }}",
                "commit": "${{ github.sha }}",
                "workflow": "${{ github.workflow }}",
                "event": "${{ github.event_name }}"
              },
              "resolvedDependencies": [
                {
                  "uri": "git+https://github.com/${{ github.repository }}",
                  "digest": { "sha1": "${{ github.sha }}" }
                }
              ]
            },
            "runDetails": {
              "builder": { "id": "https://github.com/actions/runner/github-hosted" },
              "metadata": {
                "invocationId": "${{ github.run_id }}-${{ github.run_attempt }}",
                "startedOn": "$STARTED_AT"
              }
            }
          }
          EOF
          cosign attest --yes \
            --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            --predicate provenance.json --type slsaprovenance1 \
            ghcr.io/${{ env.OWNER_LC }}/web@${{ steps.build.outputs.digest }}
