[package]
name = "web"
version = "0.4.4"
edition = "2024"

[dependencies]
# axum: default pulls form/json/matched-path/original-uri/tower-log/tracing;
# we only use the HTTP1 server, the Query extractor, and tokio-backed serve.
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
# toml: only parsing frontmatter; "display" (serialization) is unused.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
anyhow = "1.0"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "macros"] }
# ammonia: default pulls "uluru" (auto-link rel detection) which we don't use.
ammonia = { version = "4.0", default-features = false }
# syntect: syntax highlighting rendered to classed HTML at load time. Pure-Rust
# (fancy-regex) so the distroless/musl build stays portable; no oniguruma C dep.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
# xxhash-rust: deterministic xxh3 for ETag generation. Stable across builds and
# restarts (unlike DefaultHasher) so cached clients keep getting 304s across
# deploys. no_std, zero transitive deps.
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
