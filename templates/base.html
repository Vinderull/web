<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link rel="alternate" type="application/atom+xml" href="/feed.xml" title="{{ site_name }}">
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/js/htmx.min.js" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc"></script>
</head>
<body hx-boost:inherited="true">
    <header>
        <h1><a href="/">{{ site_name }}</a></h1>
        <nav><a href="/tags">Tags</a> · <a href="/about">About</a></nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p><a href="/feed">Atom Feed</a></p>
        <p>Powered by Rust, axum, and htmx</p>
        <p>&copy; 2026 Ryan Dufour. Source code licensed under the <a href="https://opensource.org/license/MIT">MIT License</a>.</p>
    </footer>
</body>
</html>
