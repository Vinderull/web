{% extends "base.html" %}

{% block title %}My Blog{% endblock %}

{% block content %}
<h2>Posts</h2>
<form class="search" role="search" hx-get="/search" hx-trigger="input changed delay:300ms, search" hx-target="#post-list" hx-swap="outerHTML">
    <input type="search" name="q" placeholder="Search posts…" aria-label="Search posts" autocomplete="off">
</form>
{% if posts.is_empty() %}
<p>No posts yet.</p>
{% else %}
<ul class="post-list" id="post-list">
{% for post in posts %}
    <li>
        <a href="/posts/{{ post.slug }}">
            <span class="post-title">{{ post.title }}</span>
            <time class="post-date">{{ post.date_display }}</time>
        </a>
    </li>
{% endfor %}
</ul>
{% endif %}
{% endblock %}
