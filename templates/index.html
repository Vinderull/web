{% extends "base.html" %}

{% block title %}My Blog{% endblock %}

{% block content %}
<h2>Posts</h2>
{% if posts.is_empty() %}
<p>No posts yet.</p>
{% else %}
<ul class="post-list">
{% for post in posts %}
    <li>
        <a href="/posts/{{ post.slug }}">
            <span class="post-title">{{ post.title }}</span>
            <time class="post-date">{{ post.date_display }}</time>
        </a>
    </li>
{% endfor %}
</ul>
{% endif %}
{% endblock %}
